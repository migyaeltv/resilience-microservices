spring.application.name=order-microservice

spring.datasource.url=jdbc:mysql://localhost:3306/orders
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect


server.port=8080

logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.tcc.eng.soft=DEBUG

spring.cloud.openfeign.enabled=true
feign.client.config.default.loggerLevel=basic
management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

management.server.port=8080

resilience4j.retry.instances.orderServiceRetry.max-attempts=3
resilience4j.retry.instances.orderServiceRetry.wait-duration=8s
resilience4j.retry.instances.orderServiceRetry.exponential-backoff-multiplier=2
resilience4j.retry.instances.orderServiceRetry.retry-exceptions=feign.FeignException
resilience4j.retry.instances.orderServiceRetry.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
