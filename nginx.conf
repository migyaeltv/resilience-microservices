events {
    worker_connections 65535;  # Maximiza conexões simultâneas por worker
    multi_accept on;  # Aceita múltiplas conexões ao mesmo tempo
    use epoll;  # Melhora eficiência em Linux
}

http {

    sendfile on;  
    tcp_nopush on;  
    tcp_nodelay on;  
    keepalive_timeout 75;  # Mantém conexões abertas por mais tempo, reduz latência
    keepalive_requests 1000;  # Permite mais requisições por conexão mantida
    reset_timedout_connection on;  # Libera conexões travadas rapidamente
    client_body_buffer_size 16M;  # Aumenta o buffer de requisições grandes
    client_max_body_size 200M;  # Suporta requisições maiores sem erro

    log_format json_logs '{'
                     '"time": "$time_iso8601",'
                     '"remote_addr": "$remote_addr",'
                     '"request": "$request",'
                     '"status": "$status",'
                     '"body_bytes_sent": "$body_bytes_sent",'
                     '"request_time": "$request_time"'
                     '}';

    access_log /var/log/nginx/access.log json_logs;
    error_log /var/log/nginx/error.log warn;

    upstream order_service {
        server order:8080 max_fails=2 fail_timeout=5s;  # Mais rápido para remover servidores quebrados
        keepalive 100;  # Mantém conexões abertas com upstream
    }

    server {
        listen 80 reuseport;  # Permite múltiplos workers usarem a mesma porta
        server_tokens off;  # Oculta versão do Nginx por segurança

        location /orders {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;  # Usa HTTP/1.1 para suporte a keepalive
            proxy_set_header Connection "";  # Garante que keepalive funcione
            proxy_buffering on;  # Melhora performance ao armazenar respostas em buffer
            proxy_buffers 32 4m;  # Melhora capacidade de bufferamento
            proxy_busy_buffers_size 8m;
            proxy_temp_file_write_size 8m;

            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;  # Dá mais tempo para o backend responder

            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 1;

            error_page 502 503 504 =503 /custom_503.html;
        }

        location = /custom_503.html {
            internal;
            default_type text/html;
            return 503 "Service Unavailable - O serviço de pedidos está fora do ar.";
        }
    }

    server {
        listen 9114;

        location /metrics {
            stub_status on;
            allow all;
            access_log off;  
        }
    }
}